<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Time - Host</title>
  </head>
  <body>
    <div id="app" class="min-h-screen p-4">
      <!-- Loading State -->
      <div id="loading" class="flex items-center justify-center min-h-screen">
        <div class="text-center">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500 mx-auto mb-4"></div>
          <p class="text-gray-400">Creating quiz session...</p>
        </div>
      </div>

      <!-- Lobby State -->
      <div id="lobby" class="hidden min-h-screen flex items-center justify-center p-8">
        <div class="flex flex-col lg:flex-row gap-12 w-full max-w-6xl">
          <!-- Left Side: QR, Code, Start -->
          <div class="flex flex-col items-center justify-center lg:w-1/2">
            <h1 class="text-4xl font-bold text-purple-500 mb-8">Quiz Time!</h1>

            <!-- QR Code -->
            <div id="qr-container" class="bg-white p-4 rounded-2xl mb-6">
              <canvas id="qr-code"></canvas>
            </div>

            <!-- Join Code -->
            <div class="text-6xl font-mono font-bold tracking-[0.3em] text-white mb-8" id="join-code-display"></div>

            <!-- Start Button -->
            <button
              id="start-btn"
              disabled
              class="bg-green-600 hover:bg-green-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white text-2xl font-bold py-4 px-12 rounded-xl transition-all"
            >
              START QUIZ
            </button>
          </div>

          <!-- Right Side: Players List -->
          <div class="lg:w-1/2 flex flex-col">
            <h2 class="text-xl text-gray-400 mb-4 text-center">
              Players Joined (<span id="participant-count">0</span>)
            </h2>
            <div id="participant-list" class="flex flex-wrap gap-2 justify-center content-start overflow-y-auto max-h-[70vh] bg-gray-900/50 rounded-xl p-4 border border-gray-700/50 shadow-[inset_0_2px_8px_rgba(0,0,0,0.3)]"></div>
          </div>
        </div>
      </div>

      <!-- Question State -->
      <div id="question-view" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-400">Question <span id="q-number">1</span>/<span id="q-total">5</span></span>
          <span class="text-2xl font-bold" id="timer">20</span>
        </div>

        <!-- Timer Bar -->
        <div class="w-full bg-gray-800 rounded-full h-2 mb-8">
          <div id="timer-bar" class="timer-bar" style="width: 100%"></div>
        </div>

        <!-- Question Text -->
        <h2 id="question-text" class="text-3xl md:text-5xl font-bold text-center mb-8"></h2>

        <!-- Question Image (if any) -->
        <div id="question-image-container" class="hidden flex justify-center mb-8">
          <img id="question-image" class="max-h-96 max-w-full object-contain rounded-xl" />
        </div>

        <!-- Answer Options -->
        <div class="grid grid-cols-2 gap-4 mt-auto">
          <div id="option-0" class="answer-red rounded-xl p-6 text-xl md:text-2xl font-bold flex items-center">
            <span class="mr-4 text-3xl">&#9650;</span>
            <span class="option-text"></span>
          </div>
          <div id="option-1" class="answer-blue rounded-xl p-6 text-xl md:text-2xl font-bold flex items-center">
            <span class="mr-4 text-3xl">&#9670;</span>
            <span class="option-text"></span>
          </div>
          <div id="option-2" class="answer-yellow rounded-xl p-6 text-xl md:text-2xl font-bold flex items-center">
            <span class="mr-4 text-3xl">&#9679;</span>
            <span class="option-text"></span>
          </div>
          <div id="option-3" class="answer-green rounded-xl p-6 text-xl md:text-2xl font-bold flex items-center">
            <span class="mr-4 text-3xl">&#9632;</span>
            <span class="option-text"></span>
          </div>
        </div>

        <!-- Answer Count -->
        <div class="text-center mt-4 text-gray-400">
          <span id="answer-count">0</span>/<span id="total-participants">0</span> answered
        </div>
      </div>

      <!-- Reveal State -->
      <div id="reveal-view" class="hidden min-h-screen flex flex-col items-center justify-center">
        <h2 id="reveal-question" class="text-2xl text-gray-400 mb-8"></h2>

        <!-- Answer Distribution -->
        <div class="w-full max-w-2xl space-y-4 mb-8" id="answer-distribution"></div>

        <!-- Next Button -->
        <button
          id="next-btn"
          class="bg-purple-600 hover:bg-purple-700 text-white text-2xl font-bold py-4 px-12 rounded-xl transition-all"
        >
          NEXT QUESTION
        </button>
      </div>

      <!-- Leaderboard State -->
      <div id="leaderboard-view" class="hidden min-h-screen flex flex-col items-center justify-center">
        <h1 class="text-4xl font-bold text-purple-500 mb-12">FINAL RESULTS</h1>

        <!-- Podium -->
        <div id="podium" class="flex items-end justify-center gap-4 mb-12"></div>

        <!-- Full Rankings -->
        <div id="rankings" class="w-full max-w-md space-y-2"></div>

        <!-- New Game Button -->
        <button
          id="new-game-btn"
          class="mt-8 bg-purple-600 hover:bg-purple-700 text-white text-xl font-bold py-3 px-8 rounded-xl transition-all"
        >
          HOST NEW GAME
        </button>
      </div>
    </div>
    <script type="module" src="/src/host.ts"></script>
  </body>
</html>
